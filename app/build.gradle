// EXSUNG SYSTEM COMPONENT: App Module Gradle Build File
// Refer to Master Architecture Plan: d:/Desktop/Experiments/Exsung/PLAN.md

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.system.core'
    compileSdk 34

    defaultConfig {
        applicationId "com.system.core"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true // R8 / ProGuard Obfuscation Enabled
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
